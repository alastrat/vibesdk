<!doctype html>
<html lang="en" data-theme="estori">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="alternate icon" href="/favicon.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://cdnjs.cloudflare.com https://cdn.tailwindcss.com https://esm.sh https://static.cloudflareinsights.com https://js.stripe.com https://*.js.stripe.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self'; img-src 'self' data: https:; connect-src 'self' wss: ws: http: https:; frame-src 'self' http://*.localhost:* https://*;" />
		<title data-default>Estori</title>
		<meta name="description" data-default content="Describe your store and Estori builds it in minutes, with your products, cart and checkout. Free to build." />
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('theme');
					var theme =
						stored === 'light' || stored === 'dark' || stored === 'system'
							? stored
							: 'system';
					var resolved =
						theme === 'system'
							? window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light'
							: theme;
					document.documentElement.dataset.mode = resolved;
					document.documentElement.style.colorScheme = resolved;
				} catch (_) {}
			})();
		</script>
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('estori:locale');
					if (['en', 'es', 'pt-BR'].indexOf(stored) !== -1) document.documentElement.lang = stored;
				} catch (_) {}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
