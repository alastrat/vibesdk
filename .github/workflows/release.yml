name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.repository == 'alastrat/vibesdk'
    runs-on: ubuntu-latest
    steps:
      # Versions and the changelog come from release-please-config.json and
      # .release-please-manifest.json; history starts at the fork from VibeSDK.
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
