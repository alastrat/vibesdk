name: Deploy (Estori production)

on:
  push:
    branches: [estori-live]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: estori-production
  cancel-in-progress: false

jobs:
  production:
    if: github.repository == 'alastrat/vibesdk'
    uses: ./.github/workflows/deploy-estori-reusable.yml
    with:
      environment: production
      wrangler-config: wrangler.estori.jsonc
      app-origin: https://estori.app
      preview-probe-url: https://preview.estori.app/
      worker-name: estori-production
    secrets: inherit
